name: Auto Screenshot After GitHub Pages Deployment

on:
  push:
    branches: ["*"]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install playwright sharp serve
          npx playwright install --with-deps chromium

      - name: Run Screenshot Generator
        uses: krishna-gramener/github-screenshots@v1
        with:
          url: http://localhost:5000
          output: screenshot.webp

      - name: Commit screenshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add screenshot.webp
          git commit -m "📸 Updated full-page screenshot" || echo "No changes to commit"
          git push