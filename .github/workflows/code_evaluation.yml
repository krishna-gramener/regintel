name: Code Structure Evaluation

on:
  # Choose when to run the action
  push:
    branches: [ 'evaluator-github-action' ]  # Or any branch you want to monitor

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed if you want to commit results back to repo
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches all history for all branches and tags
      
      # Step 2: Install dependencies for the action
      - name: Install Dependencies
        shell: bash
        run: |
          cd ${{ github.action_path || '.' }}
          npm ci
      
      # Step 3: Run your Code Structure Evaluator action
      - name: Evaluate Code Structure
        uses: krishna-gramener/viva-evaluation-github-actions@main
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
          # Optional: Specify a custom rubric file
          # rubric: 'path/to/custom-rubric.yml'
        id: evaluation
      
      # Step 4: Commit the Result.md file to the repository (optional)
      - name: Commit Result.md
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Result.md
          git commit -m "Add code structure evaluation result"
          git push
        # This step will fail if the workflow doesn't have write permissions
      
      # Step 5: Upload the report as a workflow artifact (useful if commit fails)
      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-structure-report
          path: Result.md